# Checks and builds the site and the relay from the wevir commit the submodule pins, and deploys both to Cloudflare as
# one Worker (web.wevir.si, see wrangler.jsonc) from main. Scheduled runs also advance the pin after successful checks
# and deployment. Pull requests only run the checks against their committed pin.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and SOURCE_TAG_KEY (the relay's HMAC key for source tags, any long
# random string, uploaded with each deploy through --secrets-file). Without the token nothing is deployed.
name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sync_desktop:
        description: Sync Desktop
        type: boolean
        default: true
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # Deploys from main queue instead of cancelling each other.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wevir_sha: ${{ steps.source.outputs.wevir_sha }}
      changed: ${{ steps.source.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve Desktop commit
        id: source
        env:
          SYNC_DESKTOP: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_desktop)) }}
        run: |
          pinned=$(git rev-parse HEAD:wevir)
          wevir_sha="$pinned"
          changed=false
          if [ "$SYNC_DESKTOP" = true ]; then
            wevir_sha=$(git ls-remote --exit-code https://github.com/marvinli001/wevir.git refs/heads/master | cut -f1)
            if [ "$wevir_sha" != "$pinned" ]; then changed=true; fi
          fi
          echo "wevir_sha=$wevir_sha" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  web:
    needs: source
    if: github.event_name != 'schedule' || needs.source.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Use resolved Desktop commit
        env:
          WEVIR_SHA: ${{ needs.source.outputs.wevir_sha }}
        run: |
          git -C wevir fetch --depth=1 origin "$WEVIR_SHA"
          git -C wevir checkout --detach FETCH_HEAD

      # The version comes from wevir's packageManager; the dependencies are wevir's, under its lockfile.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: wevir/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: wevir/.node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            wevir/pnpm-lock.yaml

      - name: Install
        run: pnpm run setup
        env:
          CI: '1'

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Test shared Desktop renderer
        working-directory: wevir
        run: pnpm vitest run --project desktop apps/desktop/src/renderer

      - name: Build the site
        run: pnpm run build

      # The relay's bundle needs the protocol package's dist; its protocol tests also start the Node relay.
      - name: Build the relay
        working-directory: wevir
        run: pnpm --filter "@wevir/relay-worker..." --filter "@wevir/relay..." build

      - name: Check the relay
        working-directory: wevir
        run: |
          pnpm --filter @wevir/relay-worker typecheck
          pnpm vitest run --project relay-worker --project relay

      - name: Deploy
        id: deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_TAG_KEY: ${{ secrets.SOURCE_TAG_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; nothing deployed."
            exit 0
          fi
          if [ -z "$SOURCE_TAG_KEY" ]; then
            echo "::error::SOURCE_TAG_KEY is not set"
            exit 1
          fi
          secrets="$RUNNER_TEMP/relay-secrets.json"
          umask 077
          node -e 'process.stdout.write(JSON.stringify({ SOURCE_TAG_KEY: process.env.SOURCE_TAG_KEY }))' > "$secrets"
          ./.wevir/apps/relay-worker/node_modules/.bin/wrangler deploy --secrets-file "$secrets"
          rm -f "$secrets"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Health check
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS https://web.wevir.si/healthz && curl -fsS -o /dev/null https://web.wevir.si/; then exit 0; fi
            sleep 6
          done
          exit 1

  record-sync:
    needs: [source, web]
    if: github.ref == 'refs/heads/main' && needs.source.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Only this job can write. The build above runs with read-only repository access.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Record verified Desktop commit
        env:
          WEVIR_SHA: ${{ needs.source.outputs.wevir_sha }}
        run: |
          git -C wevir fetch --depth=1 origin "$WEVIR_SHA"
          git -C wevir checkout --detach FETCH_HEAD
          git add wevir
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Sync Desktop renderer to ${WEVIR_SHA:0:8}"
          git push origin HEAD:main
