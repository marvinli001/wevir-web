# Checks and builds the site and the relay from the wevir commit the submodule pins, and deploys both to Cloudflare as
# one Worker (web.wevir.si, see wrangler.jsonc) from main, on pushes and manual runs. Pull requests only run the checks.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and SOURCE_TAG_KEY (the relay's HMAC key for source tags, any long
# random string, uploaded with each deploy through --secrets-file). Without the token nothing is deployed.
name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # Deploys from main queue instead of cancelling each other.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      # The version comes from wevir's packageManager; the dependencies are wevir's, under its lockfile.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: wevir/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: wevir/.node-version
          cache: pnpm
          cache-dependency-path: wevir/pnpm-lock.yaml

      - name: Install
        run: pnpm run setup
        env:
          CI: '1'

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build the site
        run: pnpm run build

      # The relay's bundle needs the protocol package's dist; its protocol tests also start the Node relay.
      - name: Build the relay
        working-directory: wevir
        run: pnpm --filter "@wevir/relay-worker..." --filter "@wevir/relay..." build

      - name: Check the relay
        working-directory: wevir
        run: |
          pnpm --filter @wevir/relay-worker typecheck
          pnpm vitest run --project relay-worker --project relay

      - name: Deploy
        id: deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_TAG_KEY: ${{ secrets.SOURCE_TAG_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; nothing deployed."
            exit 0
          fi
          if [ -z "$SOURCE_TAG_KEY" ]; then
            echo "::error::SOURCE_TAG_KEY is not set"
            exit 1
          fi
          secrets="$RUNNER_TEMP/relay-secrets.json"
          umask 077
          node -e 'process.stdout.write(JSON.stringify({ SOURCE_TAG_KEY: process.env.SOURCE_TAG_KEY }))' > "$secrets"
          ./.wevir/apps/relay-worker/node_modules/.bin/wrangler deploy --secrets-file "$secrets"
          rm -f "$secrets"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Health check
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://web.wevir.si/healthz && curl -fsS -o /dev/null https://web.wevir.si/; then exit 0; fi
            sleep 6
          done
          exit 1
