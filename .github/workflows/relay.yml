# Deploys the official Wevir relay (wevir's apps/relay-worker, Cloudflare Workers + Durable Objects) to relay.wevir.si,
# from the wevir commit the submodule pins. Runs when the pin or this file changes on main, and on manual runs: the relay's
# protocol tests and typecheck first, then `wrangler deploy`, then a health check.
#
# Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (shared with the site's deploy) and SOURCE_TAG_KEY, the relay's
# HMAC key for source tags (any long random string), uploaded with each deploy through --secrets-file. Without the token
# only the checks run.
name: Relay

on:
  push:
    branches: [main]
    paths:
      - wevir
      - .github/workflows/relay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deploys queue instead of cancelling each other.
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wevir
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      # The version comes from wevir's packageManager; the dependencies are wevir's, under its lockfile.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: wevir/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: wevir/.node-version
          cache: pnpm
          cache-dependency-path: wevir/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The bundle needs the protocol package's dist; the protocol tests also start the Node relay.
      - name: Build
        run: pnpm --filter "@wevir/relay-worker..." --filter "@wevir/relay..." build

      - name: Typecheck
        run: pnpm --filter @wevir/relay-worker typecheck

      - name: Protocol tests
        run: pnpm vitest run --project relay-worker --project relay

      - name: Deploy
        id: deploy
        working-directory: wevir/apps/relay-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_TAG_KEY: ${{ secrets.SOURCE_TAG_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; nothing deployed."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SOURCE_TAG_KEY" ]; then
            echo "::error::SOURCE_TAG_KEY is not set"
            exit 1
          fi
          secrets="$RUNNER_TEMP/relay-secrets.json"
          umask 077
          node -e 'process.stdout.write(JSON.stringify({ SOURCE_TAG_KEY: process.env.SOURCE_TAG_KEY }))' > "$secrets"
          pnpm exec wrangler deploy --secrets-file "$secrets"
          rm -f "$secrets"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # A new custom domain waits for its certificate; give it up to a minute.
      - name: Health check
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://relay.wevir.si/healthz; then exit 0; fi
            sleep 6
          done
          exit 1
